; Reference supervisor program for Laravel queue workers.
;
; This file is a REFERENCE. Changing supervisor configs is out of the deploy
; scope and needs explicit approval from whoever owns the server.
;
; Key points:
;   - directory and the artisan path use <base>/current (the symlink).
;   - command uses the versioned PHP binary, the same one used by PHP-FPM.
;   - user is the deploy user, so workers write to storage with the same owner.
;   - "artisan queue:restart" (run by release.sh) makes workers finish the
;     current job and exit, supervisor starts them again on the new code.

[program:example-worker]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/example.com/current
command=/usr/bin/php8.3 /var/www/example.com/current/artisan queue:work --sleep=3 --tries=3 --max-time=3600
user=deploy
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/www/example.com/shared/storage/logs/worker.log

; Horizon variant (one process, QUEUE_MODE=horizon in release.sh):
; [program:example-horizon]
; directory=/var/www/example.com/current
; command=/usr/bin/php8.3 /var/www/example.com/current/artisan horizon
; user=deploy
; autostart=true
; autorestart=true
; stopwaitsecs=3600
; redirect_stderr=true
; stdout_logfile=/var/www/example.com/shared/storage/logs/horizon.log

; To let the deploy user run supervisorctl without sudo, the socket in
; /etc/supervisor/supervisord.conf must be reachable by its group, e.g.:
;
; [unix_http_server]
; file=/var/run/supervisor.sock
; chmod=0770
; chown=root:www-data
;
; This is a server change, ask before applying it.
